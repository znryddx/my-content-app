<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>这男人有点东西</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <!-- 顶栏（极简、几乎透明） -->
  <header class="topbar">
    <div class="topbar-title" id="topbarTitle">这男人有点东西</div>
  </header>

  <!-- 主页：Marvis 工位网格 -->
  <main id="scene"></main>

  <!-- 品类视图：内容卡片网格 -->
  <section class="cv" id="cv" aria-hidden="true">
    <div class="cv-top">
      <button class="cv-back" id="cvBack" aria-label="返回">‹ 返回</button>
      <div class="cv-title" id="cvTitle"></div>
      <button class="cv-date" id="cvDate">切换日期 ▾</button>
    </div>
    <div class="cv-content" id="cvContent"></div>
  </section>

  <!-- 内容详情弹层 -->
  <div class="detail-modal" id="detailModal" aria-hidden="true">
    <div class="detail-top">
      <button class="detail-btn" id="detailBack">‹ 返回列表</button>
      <button class="detail-btn" id="detailCopy">复制全文</button>
    </div>
    <h3 class="detail-title" id="detailTitle"></h3>
    <div class="detail-body" id="detailBody"></div>
  </div>

  <!-- 日期选择弹层 -->
  <div class="date-sheet" id="dateSheet" aria-hidden="true">
    <div class="detail-top">
      <button class="detail-btn" id="dateClose">‹ 关闭</button>
      <div class="detail-sheet-title">选择日期</div>
      <div></div>
    </div>
    <div class="date-list" id="dateList"></div>
  </div>

  <div class="toast" id="toast"></div>

  <script src="./isometric.js"></script>
  <script src="./app.js"></script>
</body>
</html>
