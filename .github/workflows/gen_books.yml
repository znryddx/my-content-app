name: gen-law-books
on:
  workflow_dispatch:
  schedule:
    - cron: '23 18 1 * *'   # 每月1日北京时间约02:23 巡检补满（已满则无操作，零成本）
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: generate law knowledge books
        env:
          OPENROUTER_API_KEY: ${{ secrets.LLM_API_KEY }}
        run: python gen_books.py
      - name: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/law/books.json
          git commit -m "chore: topup law knowledge books" || echo "no changes"
          git push
