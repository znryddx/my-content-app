name: Generate daily content

# 触发条件：
#   1) 定时：每天 UTC 23:00（≈ 北京 07:00）自动跑，电脑关机也照常更新
#   2) 手动：在 Actions 页面点 "Run workflow" 立即生成
on:
  schedule:
    - cron: "0 23 * * *"
  workflow_dispatch:

# 关键权限：contents: write —— 把生成的 data/ 提交回仓库，触发 Pages 重部署
# 模型调用改用免费 OpenAI 兼容 API（GitHub Models 已于 2026-07-30 退役），
# Key 通过 Secrets 注入，不写死在仓库里。
permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate per-category daily content via free LLM API
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
        run: python .github/scripts/generate.py

      - name: Commit & push (triggers GitHub Pages redeploy)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git commit -m "chore: update daily content [skip ci]" || echo "no changes"
          git push
