name: 每日内容生成（零成本）

on:
  schedule:
    # 多错峰触发，规避 GitHub 对单一 scheduled workflow 的偶发跳过（免费、纯配置）
    # UTC 0/5/10 约= 北京时间 08/13/18 点，命中其一即可生成当日内容
    - cron: "7 0 * * *"
    - cron: "7 5 * * *"
    - cron: "7 10 * * *"
  workflow_dispatch:
    inputs:
      full:
        description: '全量生成所有分类（默认轮换）'
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  models: read

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 配置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 抓取当日热点（脚本联网，0 成本）
        run: python .github/scripts/fetch_feed.py

      - name: 生成内容（免费模型，0 成本）
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_MODEL: ${{ secrets.LLM_MODEL || 'google/gemma-4-31b-it:free' }}
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL || 'https://openrouter.ai/api/v1' }}
          GH_MODELS_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FULL_REGEN: ${{ github.event.inputs.full && '1' || '' }}
        run: python .github/scripts/generate.py

      - name: 提交并触发 Pages 部署
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "无内容变化，跳过提交"
          else
            git commit -m "daily content $(date +%F) [bot]"
            git push
          fi
