name: Generate daily content

# 触发条件：
#   1) 定时：每天 UTC 23:00（≈ 北京 07:00）自动跑，电脑关机也照常更新
#   2) 手动：在 Actions 页面点 "Run workflow" 立即生成
on:
  schedule:
    - cron: "0 23 * * *"
  workflow_dispatch:

# 关键权限：
#   contents: write —— 把生成的 data/ 提交回仓库，触发 Pages 重部署
#   models: read   —— 允许用内置 GITHUB_TOKEN 调用 GitHub Models 免费额度（无需单独建 PAT）
permissions:
  contents: write
  models: read

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate per-category daily content via GitHub Models (free quota)
        env:
          # Actions 自动提供的内置令牌，已通过 permissions: models: read 获得模型访问权
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python .github/scripts/generate.py

      - name: Commit & push (triggers GitHub Pages redeploy)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git commit -m "chore: update daily content [skip ci]" || echo "no changes"
          git push
