name: 每日内容生成（零成本）

# 「D-1 生成 / D 日发布」：这里只在前一天把次日内容生成到暂存区，不直接上线，
# 由 publish.yml 在次日早上搬运上线。本机是否开机都不影响更新。
#
# cron 时刻已按 GitHub 免费档实测 4~5.5 小时延迟倒推，三个错峰互为兜底：
#   UTC 03:05 → 实落 ≈ UTC 08:00（前一天下午）
#   UTC 12:05 → 实落 ≈ UTC 17:00（当天凌晨）
#   UTC 15:05 → 实落 ≈ UTC 20:00（发布前的最后一个窗口）
# generate.py 已幂等：目标日期内容齐全时直接跳过，重复触发不会重复消耗免费额度。

on:
  schedule:
    - cron: "5 3 * * *"
    - cron: "5 12 * * *"
    - cron: "5 15 * * *"
  workflow_dispatch:
    inputs:
      target_date:
        description: '目标日期 YYYY-MM-DD（留空=自动推算）'
        required: false
        type: string
      full:
        description: '全量生成所有分类（默认轮换）'
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  models: read

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 配置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 推算目标日期
        id: target
        run: |
          D=$(python .github/scripts/next_target.py "${{ github.event.inputs.target_date }}")
          echo "date=$D" >> "$GITHUB_OUTPUT"
          echo "目标日期 = $D"

      - name: 抓取热点素材（写入目标日期的 feed）
        env:
          TARGET_DATE: ${{ steps.target.outputs.date }}
        run: python .github/scripts/fetch_feed.py

      - name: 生成内容到暂存区（不直接上线、不动轮换）
        env:
          TARGET_DATE: ${{ steps.target.outputs.date }}
          STAGE_DIR: data/_pre/${{ steps.target.outputs.date }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_MODEL: ${{ secrets.LLM_MODEL || 'google/gemma-4-31b-it:free' }}
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL || 'https://openrouter.ai/api/v1' }}
          GH_MODELS_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # 严格布尔比较：直接写 inputs.full 会被 GitHub 序列化成字符串，
          # 传 false 也会变成 truthy 字符串从而误触发全量生成（白白多消耗免费额度）
          FULL_REGEN: ${{ inputs.full == true && '1' || '' }}
        run: python .github/scripts/generate.py

      - name: 提交暂存内容
        # 关键：即使部分分类生成失败也要提交已成功的部分。
        # 否则这一轮失败的会以退出码终止 job，成功的分类随之被丢弃，
        # 下一轮错峰又得从零开始 —— 而幂等机制本可以让下一轮只补缺的那几个。
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/_pre/ data/feed/
          if git diff --cached --quiet; then
            echo "无内容变化，跳过提交"
          else
            git commit -m "stage ${{ steps.target.outputs.date }} [bot]"
            git push
          fi
