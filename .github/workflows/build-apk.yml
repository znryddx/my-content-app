name: Build APK
on:/n  workflow_dispatch:/n  push:/n    paths:/n      - "android/**"
jobs:/n  build:/n    runs-on: ubuntu-latest
    steps:/n      - name: checkout
        uses: actions/checkout@v4
      - name: setup JDK 17
        uses: actions/setup-java@v4
        with:/n          distribution: temurin
          java-version: "17"
      - name: install Android SDK
        uses: android-actions/setup-android@v3
      - name: install SDK and accept licenses
        run: |
          sdkmanager "platforms;android-34" "build-tools;34.0.0"
          yes | sdkmanager --licenses
      - name: build Debug APK
        uses: gradle/gradle-build-action@v3
        with:/n          build-root-directory: android
          arguments: assembleDebug
      - name: upload APK
        uses: actions/upload-artifact@v4
        with:/n          name: app-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
