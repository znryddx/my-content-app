name: 屏风柜子文案 · 每日生成

on:
  schedule:
    - cron: '30 16 * * *'      # 北京时间 00:30 每日生成
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: 生成今日文案
        run: node scripts/gen-pingfenguizi.js
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SC_MODEL: ${{ vars.SC_MODEL || 'gpt-4o-mini' }}
      - name: 提交
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/pingfenguizi
          git commit -m "chore: 屏风柜子文案 $(date +%F)" || echo "no changes"
          git push
