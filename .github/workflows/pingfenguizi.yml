name: 屏风柜子文案 · 每日生成

on:
  schedule:
    - cron: '30 16 * * *'      # 北京时间 00:30 每日生成
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: 生成今日文案
        run: node scripts/gen-pingfenguizi.js
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL || 'https://openrouter.ai/api/v1' }}
          LLM_MODEL: ${{ secrets.LLM_MODEL || 'google/gemma-4-31b-it:free' }}
          SC_MODEL: ${{ secrets.SC_MODEL || 'google/gemma-4-31b-it:free' }}
      - name: 提交并推送
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/pingfenguizi scripts gen-pingfenguizi.js 2>/dev/null || git add data/pingfenguizi scripts/gen-pingfenguizi.js
          git commit -m "chore: 屏风柜子文案 $(date +%F)" || echo "no changes"
          git push
