<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>我的每日内容 · 俯视写实预览</title><style>:root {
  --bg: #ffffff;
  --card: #ffffff;
  --line: #f0f2f5;
  --text: #374151;
  --muted: #9aa3b2;
  --accent: #2563eb;
  --red: #ef4444;
  --done: #9aa3b2;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; padding: 0; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
  -webkit-font-smoothing: antialiased;
  overscroll-behavior: none;
}

/* ====== 顶栏（极简，几乎透明）====== */
.topbar {
  position: sticky; top: 0; z-index: 10;
  background: rgba(255,255,255,.75);
  backdrop-filter: saturate(180%) blur(12px);
  -webkit-backdrop-filter: saturate(180%) blur(12px);
  border-bottom: 1px solid rgba(0,0,0,.04);
  padding: 13px 20px;
  font-size: 15px; font-weight: 500;
  display: flex; align-items: center; justify-content: space-between;
}
.topbar .sub { font-size: 11px; color: var(--muted); font-weight: 400; }
#scene { max-width: 1000px; margin: 0 auto; padding: 16px 16px 70px; }

/* ========== 首页：Marvis 精确布局（左休闲区竖排 + 右双列工位浮底） ========== */
.home-layout {
  display: flex;
  gap: 28px;
  align-items: flex-start;
}

/* 左侧休闲区（~26% 宽度，竖排） */
.leisure-zone {
  width: 25%;
  min-width: 170px;
  display: flex;
  flex-direction: column;
  gap: 24px;
  flex-shrink: 0;
  padding-top: 4px;
}
.leisure-item {
  text-align: center;
  cursor: default;
}
.leisure-item.clickable { cursor: pointer; }
.leisure-item .scene-img {
  width: 100%;
  height: auto;
  display: block;
  border-radius: 12px;
  box-shadow: 0 2px 12px rgba(0,0,0,.05);
  transition: opacity .2s;
}
.leisure-item.clickable:hover .scene-img { opacity: .8; }
.leisure-item .cap {
  font-size: 10.5px;
  color: var(--muted);
  margin-top: 5px;
  letter-spacing: .5px;
}

/* 右侧工位区（固定双列网格 —— 无卡片、无边框、直接浮白底）*/
.station-area {
  flex: 1;
  min-width: 0;
}
.station-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 24px 32px;
  align-items: start;
}

/* 工位卡片 —— Marvis 风格：无背景无边框，只有标签+图形+提示 */
.station {
  background: transparent;
  border: none;
  border-radius: 0;
  padding: 4px 2px 8px;
  text-align: center;
  cursor: pointer;
  transition: transform .2s ease;
}
.station:hover { transform: translateY(-4px) scale(1.01); }
.station:active { transform: translateY(0) scale(.99); }

/* 工位标签（在图形上方，干净无衬线） */
.station .label {
  font-size: 14px;
  font-weight: 500;
  color: var(--text);
  margin-bottom: 3px;
  letter-spacing: .3px;
}
.station .scene-img {
  width: 100%;
  height: auto;
  display: block;
  border-radius: 12px;
  box-shadow: 0 2px 16px rgba(0,0,0,.06);
}
/* 点击提示（极淡） */
.station .hint {
  font-size: 10.5px;
  color: #c0c5cd;
  margin-top: 3px;
  transition: color .15s;
}
.station:hover .hint { color: var(--muted); }

/* 手机端：上下堆叠 */
@media (max-width: 720px) {
  .home-layout {
    flex-direction: column;
    gap: 16px;
  }
  .leisure-zone {
    width: 100%;
    min-width: 0;
    flex-direction: row;
    flex-wrap: wrap;
    justify-content: center;
    gap: 12px;
  }
  .leisure-item { width: 95px; }
  .station-grid {
    grid-template-columns: repeat(2, 1fr);
    gap: 16px 14px;
  }
  .station .label { font-size: 13px; }
}
@media (max-width: 400px) {
  .station-grid { gap: 12px 10px; }
  .station .label { font-size: 12px; }
  .station .hint { font-size: 9.5px; }
}

/* ---------- 内容视图：6 宫格 ---------- */
.cv { position: relative; }
.cv-top {
  position: sticky; top: 0; z-index: 30;
  display: flex; align-items: center; justify-content: space-between;
  background: rgba(255,255,255,.92);
  backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
  padding: 8px 2px 12px; margin-bottom: 4px;
}
.cv-top .back { color: var(--accent); font-size: 13px; cursor: pointer; }
.cv-top .cv-title { font-size: 17px; font-weight: 600; }
.cv-top .cv-date { font-size: 13px; color: var(--muted); cursor: pointer; }

.grid6 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; position: relative; }
.cell {
  position: relative; height: 168px;
  border-radius: 16px; overflow: hidden;
  background: var(--card); border: 1px solid var(--line);
  touch-action: pan-y;
}
.cell-bg {
  position: absolute; top: 0; bottom: 0;
  display: flex; align-items: center; font-size: 13px; font-weight: 600; color: #fff;
  opacity: 0; transition: opacity .15s; z-index: 0;
}
.cell-bg.del { right: 0; width: 55%; justify-content: flex-end; padding-right: 14px; background: linear-gradient(90deg, rgba(239,68,68,0), var(--red)); }
.cell-bg.done { left: 0; width: 55%; justify-content: flex-start; padding-left: 14px; background: linear-gradient(90deg, var(--done), rgba(154,163,178,0)); }
.cell.show-del .cell-bg.del { opacity: 1; }
.cell.show-done .cell-bg.done { opacity: 1; }
.cell-fg {
  position: relative; z-index: 1; height: 100%;
  background: var(--card); padding: 13px 13px;
  display: flex; flex-direction: column; will-change: transform;
}
.cell-title { font-size: 13px; font-weight: 600; margin-bottom: 7px; line-height: 1.35; }
.cell-body { font-size: 11.5px; color: #6b7280; line-height: 1.55; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 7; -webkit-box-orient: vertical; white-space: pre-wrap; }
.cell.is-done .cell-fg { background: #f3f4f6; }
.cell.is-done .cell-title, .cell.is-done .cell-body { color: var(--done); text-decoration: line-through; }

/* 右侧红条（可拖动滚动） */
.redbar {
  position: fixed; right: 6px; top: 42%;
  width: 6px; height: 120px;
  background: var(--red); border-radius: 6px; opacity: .85; z-index: 45;
  touch-action: none; cursor: grab;
}
.redbar:active { cursor: grabbing; }

/* 底部按钮（可上拖） */
.addbtn {
  position: fixed; right: 18px; bottom: 24px;
  width: 54px; height: 54px; border-radius: 50%;
  background: var(--accent); color: #fff; border: none;
  font-size: 26px; line-height: 1;
  box-shadow: 0 8px 22px rgba(37, 99, 235, .4); z-index: 45;
  touch-action: none; display: none; align-items: center; justify-content: center;
}

/* ---------- 日期选择 ---------- */
.datelist { display: flex; flex-direction: column; gap: 10px; padding-top: 8px; }
.datechip { padding: 14px 16px; background: var(--card); border: 1px solid var(--line); border-radius: 14px; font-size: 15px; cursor: pointer; }
.datechip.active { border-color: var(--accent); color: var(--accent); font-weight: 600; }

/* ---------- 全屏弹窗 ---------- */
.modal { position: fixed; inset: 0; background: #fff; z-index: 100; padding: 18px 18px 90px; overflow: auto; display: none; }
.modal.show { display: block; }
.modal .m-top { display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; background: #fff; padding-bottom: 10px; border-bottom: 1px solid var(--line); margin-bottom: 14px; }
.modal .m-back { color: var(--accent); font-size: 14px; cursor: pointer; }
.modal .m-copy { color: var(--accent); font-size: 14px; cursor: pointer; border: 1px solid var(--accent); border-radius: 10px; padding: 5px 12px; }
.modal h3 { font-size: 19px; margin: 0 0 10px; }
.modal .m-body { font-size: 15px; line-height: 1.8; color: #4b5563; white-space: pre-wrap; }

.toast { position: fixed; left: 50%; bottom: 90px; transform: translateX(-50%); background: rgba(17,24,39,.9); color: #fff; font-size: 13px; padding: 10px 16px; border-radius: 12px; z-index: 200; opacity: 0; transition: opacity .2s; pointer-events: none; }
.toast.show { opacity: 1; }

@media (max-width: 380px) {
  .grid6 { gap: 9px; }
  .cell { height: 150px; }
}
</style></head><body><header class="topbar"><span>我的每日内容</span><span class="sub">俯视写实工位画廊</span></header><main id="scene"><div class="home-layout"><div class="leisure-zone"><div class="leisure-item"><div class="cap">茶水间</div><img class="scene-img" src="assets/coffee.webp" alt="kitchenette" loading="lazy"/></div><div class="leisure-item"><div class="cap">健身区</div><img class="scene-img" src="assets/treadmill.webp" alt="treadmill" loading="lazy"/></div><div class="leisure-item clickable"><div class="cap">绿植角</div><img class="scene-img" src="assets/plant.webp" alt="toilet_zone" loading="lazy"/></div></div><div class="station-area"><div class="station-grid"><div class="station"><div class="label">手串</div><img class="scene-img" src="assets/workstation.webp" alt="手串" loading="lazy"/><div class="hint">点击进入 →</div></div><div class="station"><div class="label">香道</div><img class="scene-img" src="assets/workstation.webp" alt="香道" loading="lazy"/><div class="hint">点击进入 →</div></div><div class="station"><div class="label">香炉</div><img class="scene-img" src="assets/workstation.webp" alt="香炉" loading="lazy"/><div class="hint">点击进入 →</div></div><div class="station"><div class="label">造像</div><img class="scene-img" src="assets/workstation.webp" alt="造像" loading="lazy"/><div class="hint">点击进入 →</div></div><div class="station"><div class="label">沉香</div><img class="scene-img" src="assets/workstation.webp" alt="沉香" loading="lazy"/><div class="hint">点击进入 →</div></div><div class="station"><div class="label">百宝嵌</div><img class="scene-img" src="assets/workstation.webp" alt="百宝嵌" loading="lazy"/><div class="hint">点击进入 →</div></div><div class="station"><div class="label">茶空间</div><img class="scene-img" src="assets/workstation.webp" alt="茶空间" loading="lazy"/><div class="hint">点击进入 →</div></div><div class="station"><div class="label">高端礼品</div><img class="scene-img" src="assets/workstation.webp" alt="高端礼品" loading="lazy"/><div class="hint">点击进入 →</div></div></div></div></div></main></body></html>
